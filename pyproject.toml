[tool.poetry]
name = "ecommerce-core"
version = "0.1.0"
description = "Ядро интернет-магазина на ООП"

[tool.poetry.dependencies]
python = "^3.13.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
flake8 = "^6.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
omit = ["*/test_*", "*/tests/*"]